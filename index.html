<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Fácil — IPTV</title><meta name="description" content="Reproductor IPTV para listas públicas autorizadas"><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef4ff;font:15px system-ui,Arial}header{padding:18px 20px;background:#111c30;position:sticky;top:0;z-index:2}h1{margin:0;font-size:22px}.sub{color:#9fb0ca;font-size:13px;margin-top:4px}.wrap{max-width:1100px;margin:auto;padding:16px}.panel{background:#16243a;border:1px solid #2c3c58;border-radius:14px;padding:14px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{border:0;border-radius:9px;padding:11px;font-size:14px}input{flex:1;min-width:180px;background:#fff;color:#111}button{background:#2e78ff;color:#fff;font-weight:700;cursor:pointer}button.alt{background:#263752}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap}.tabs button.on{background:#18b981}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.channel{background:#16243a;border:1px solid #2c3c58;border-radius:12px;padding:10px;cursor:pointer;min-height:92px}.channel:hover{border-color:#4d91ff}.channel img{width:38px;height:38px;object-fit:contain;float:left;margin-right:9px}.name{font-weight:750;line-height:1.2}.group{color:#9fb0ca;font-size:12px;margin-top:5px}.star{float:right;font-size:20px;color:#ffd34d}.player{display:none;margin-bottom:14px}.player.show{display:block}video{width:100%;max-height:55vh;background:#000;border-radius:10px}#status{color:#b8c9e2;margin-top:8px;min-height:1.3em}.error{color:#ffb4b4!important}.empty{text-align:center;padding:35px;color:#9fb0ca}.saveditem{display:inline-flex;align-items:center;gap:4px;margin:5px 5px 0 0}.saveditem button{padding:8px 10px}.del{background:#9b3545!important;padding:8px!important}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.channel{font-size:13px;padding:8px}input{min-width:140px}}</style></head><body><header><div class="wrap"><h1>📺 TV Fácil</h1><div class="sub">Listas públicas autorizadas, favoritos y búsqueda</div></div></header><main class="wrap"><section class="panel"><b>Añade tu lista IPTV</b><div class="row" style="margin-top:10px"><input id="name" placeholder="Nombre personalizado" aria-label="Nombre de la lista"><input id="url" placeholder="Pega aquí la URL M3U/M3U8" aria-label="URL de lista"><button id="load">Cargar URL</button><button class="alt" id="save">💾 Guardar lista</button><button class="alt" id="share">🔗 Enlace</button><label><button type="button" class="alt">Abrir archivo M3U</button><input id="file" type="file" accept=".m3u,.m3u8,text/plain" hidden></label></div><div id="saved" style="margin-top:10px"></div><div id="status">Puedes guardar varias listas con nombres distintos. Se almacenan solo en este navegador.</div></section><section id="player" class="panel player"><video id="video" controls playsinline></video><div id="now"></div></section><section class="panel"><div class="row"><input id="search" placeholder="Buscar canal..." aria-label="Buscar canal"><button class="alt" id="favOnly">★ Favoritos</button><button class="alt" id="all">Todos</button></div><div class="tabs" id="tabs" style="margin-top:10px"></div></section><section id="grid" class="grid"><div class="empty">Pega una lista M3U o abre un archivo para empezar.</div></section></main><script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script><script>
const $=id=>document.getElementById(id);let channels=[],group='Todos',onlyFav=false,hls=null;let fav=JSON.parse(localStorage.getItem('tvf-fav')||'[]');let saved=(JSON.parse(localStorage.getItem('tvf-lists')||'[]')||[]).map((x,i)=>typeof x==='string'?{name:'IPTV '+(i+1),url:x}:x);
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function valid(u){try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)}catch{return false}}
function parse(text,base){let lines=text.replace(/^\uFEFF/,'').split(/\r?\n/),out=[],pending=null;for(let raw of lines){let line=raw.trim();if(!line||line==='#EXTM3U'||line.startsWith('#EXT-X-'))continue;if(line.startsWith('#EXTINF')){let comma=line.indexOf(',');let meta=comma<0?line:line.slice(0,comma),name=(comma<0?'Canal':line.slice(comma+1)).trim()||'Canal';let attr=k=>{let m=meta.match(new RegExp(k+'="([^"]*)"','i'));return m?m[1]:''};pending={name,logo:attr('tvg-logo'),g:attr('group-title')||'Otros'};continue}if(line.startsWith('#EXTGRP:')&&pending){pending.g=line.slice(8).trim()||'Otros';continue}if(!line.startsWith('#')&&pending){try{let u=new URL(line,base).href;if(valid(u))out.push({...pending,url:u})}catch{}pending=null}}return out}
function render(){let q=$('search').value.toLowerCase().trim(),list=channels.filter(c=>(group==='Todos'||c.g===group)&&(!onlyFav||fav.includes(c.url))&&c.name.toLowerCase().includes(q));$('grid').innerHTML=list.length?list.map(c=>`<article class="channel" data-i="${channels.indexOf(c)}"><span class="star" data-url="${encodeURIComponent(c.url)}">${fav.includes(c.url)?'★':'☆'}</span>${c.logo&&valid(c.logo)?`<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.style.display='none'">`:''}<div class="name">${esc(c.name)}</div><div class="group">${esc(c.g)}</div></article>`).join(''):'<div class="empty">No hay canales con ese filtro.</div>';document.querySelectorAll('.channel').forEach(e=>e.onclick=()=>play(channels[+e.dataset.i]));document.querySelectorAll('.star').forEach(e=>e.onclick=x=>{x.stopPropagation();let u=decodeURIComponent(e.dataset.url);fav=fav.includes(u)?fav.filter(v=>v!==u):[...fav,u];localStorage.setItem('tvf-fav',JSON.stringify(fav));render()})}
function tabs(){let gs=['Todos',...new Set(channels.map(c=>c.g))];$('tabs').innerHTML=gs.map(g=>`<button class="${g===group?'on':''}">${esc(g)}</button>`).join('');document.querySelectorAll('#tabs button').forEach((b,i)=>b.onclick=()=>{group=gs[i];tabs();render()})}function loaded(text,base=''){channels=parse(text,base);group='Todos';onlyFav=false;tabs();render();$('status').textContent=channels.length?`${channels.length} canales cargados. Pulsa uno para verlo.`:'La lista no contiene entradas de canales válidas.';if(!channels.length)$('status').classList.add('error');else $('status').classList.remove('error')}
function timeout(ms){let c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return{signal:c.signal,done:()=>clearTimeout(t)}}async function getText(u){let direct=timeout(9000);try{let r=await fetch(u,{signal:direct.signal,cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let text=await r.text();if(!text.trim())throw Error('vacía');return{text,source:'directa'}}catch(e){direct.done()}let proxies=['https://api.allorigins.win/raw?url=','https://corsproxy.io/?url='];for(let p of proxies){let a=timeout(12000);try{let r=await fetch(p+encodeURIComponent(u),{signal:a.signal,cache:'no-store'});if(!r.ok)throw Error();let text=await r.text();if(text.trim())return{text,source:'proxy'} }catch{}finally{a.done()}}throw Error('No se pudo acceder a la lista')}
async function loadUrl(u){$('url').value=u;$('status').classList.remove('error');if(!valid(u)){$('status').textContent='Introduce una URL pública http(s) válida.';$('status').classList.add('error');return}$('load').disabled=true;$('status').textContent='Cargando lista (máximo 33 segundos)…';try{let r=await getText(u),text=r.text;if(!/#EXTM3U|#EXTINF/i.test(text))throw Error('formato');loaded(text,u);$('status').textContent+=` Acceso ${r.source}.`}catch(e){$('status').textContent=e.message==='formato'?'La dirección no parece una lista M3U/M3U8 válida.':'No se pudo cargar la lista tras intentar acceso directo y alternativas. Comprueba la URL o abre el archivo M3U descargado.';$('status').classList.add('error')}finally{$('load').disabled=false}}
function play(c){$('player').classList.add('show');$('now').textContent='▶ '+c.name;let v=$('video');if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();let u=c.url.toLowerCase();if(u.includes('.m3u8')&&window.Hls&&Hls.isSupported()){hls=new Hls({manifestLoadingTimeOut:10000,levelLoadingTimeOut:10000});hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){hls.destroy();hls=null;$('status').textContent='Este canal no se puede reproducir aquí (DRM, bloqueo o servidor no compatible).';$('status').classList.add('error')}})}else{v.src=c.url;v.play().catch(()=>{$('status').textContent='Formato, DRM o servidor no compatible con este navegador.';$('status').classList.add('error')})}v.onerror=()=>{$('status').textContent='El canal no responde o requiere permisos/DRM que el navegador no puede usar.';$('status').classList.add('error')};$('player').scrollIntoView({behavior:'smooth'})}
function persist(){localStorage.setItem('tvf-lists',JSON.stringify(saved));showSaved()}function showSaved(){if(!saved.length){$('saved').innerHTML='<span class="group">No hay listas guardadas.</span>';return}$('saved').innerHTML='<b>Listas guardadas:</b> '+saved.map((x,i)=>`<span class="saveditem"><button class="alt savedbtn" data-i="${i}">${esc(x.name)}</button><button class="del" data-del="${i}" title="Borrar ${esc(x.name)}">✕</button></span>`).join('');document.querySelectorAll('.savedbtn').forEach(b=>b.onclick=()=>{$('name').value=saved[+b.dataset.i].name;loadUrl(saved[+b.dataset.i].url)});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{let i=+b.dataset.del;if(confirm('¿Borrar esta lista guardada?')){saved.splice(i,1);persist();$('status').textContent='Lista borrada. Las demás listas se mantienen.'}})}
$('file').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader;r.onload=()=>loaded(r.result,location.href);r.onerror=()=>{$('status').textContent='No se pudo leer el archivo.';$('status').classList.add('error')};r.readAsText(f)}};$('load').onclick=()=>loadUrl($('url').value.trim());$('save').onclick=()=>{let u=$('url').value.trim(),n=$('name').value.trim()||'IPTV '+(saved.length+1);if(!valid(u)){$('status').textContent='Escribe una URL pública http(s) para guardarla.';return}let i=saved.findIndex(x=>x.url===u);if(i>=0)saved[i].name=n;else saved.push({name:n,url:u});persist();$('status').textContent='✅ Lista guardada.'};$('share').onclick=async()=>{let u=$('url').value.trim();if(!valid(u)){$('status').textContent='Primero escribe una URL IPTV válida.';return}let link=location.origin+location.pathname+'?iptv='+encodeURIComponent(u);try{await navigator.clipboard.writeText(link);$('status').textContent='🔗 Enlace copiado.'}catch{prompt('Copia este enlace:',link)}};$('search').oninput=render;$('favOnly').onclick=()=>{onlyFav=true;render()};$('all').onclick=()=>{onlyFav=false;render()};showSaved();let shared=new URLSearchParams(location.search).get('iptv');if(shared){$('url').value=shared;loadUrl(shared)}else if(saved.length){$('url').value=saved[saved.length-1].url;loadUrl(saved[saved.length-1].url)}
</script></body></html>
