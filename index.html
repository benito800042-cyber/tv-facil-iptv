<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Fácil — IPTV</title><meta name="description" content="Tu lista IPTV organizada con favoritos y categorías"><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef4ff;font:15px system-ui,Arial}header{padding:18px 20px;background:#111c30;position:sticky;top:0;z-index:2}h1{margin:0;font-size:22px}.sub{color:#9fb0ca;font-size:13px;margin-top:4px}.wrap{max-width:1100px;margin:auto;padding:16px}.panel{background:#16243a;border:1px solid #2c3c58;border-radius:14px;padding:14px;margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap}input,button,select{border:0;border-radius:9px;padding:11px;font-size:14px}input{flex:1;min-width:220px;background:#fff;color:#111}button{background:#2e78ff;color:#fff;font-weight:700;cursor:pointer}button.alt{background:#263752}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap}.tabs button.on{background:#18b981}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.channel{background:#16243a;border:1px solid #2c3c58;border-radius:12px;padding:10px;cursor:pointer;min-height:92px}.channel:hover{border-color:#4d91ff}.channel img{width:38px;height:38px;object-fit:contain;float:left;margin-right:9px}.name{font-weight:750;line-height:1.2}.group{color:#9fb0ca;font-size:12px;margin-top:5px}.star{float:right;font-size:20px;color:#ffd34d}.player{display:none;margin-bottom:14px}.player.show{display:block}video{width:100%;max-height:55vh;background:#000;border-radius:10px}#status{color:#9fb0ca;margin-top:8px}.empty{text-align:center;padding:35px;color:#9fb0ca}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.channel{font-size:13px;padding:8px}input{min-width:160px}}
</style></head><body><header><div class="wrap"><h1>📺 TV Fácil</h1><div class="sub">Tu IPTV organizada, con favoritos y búsqueda</div></div></header><main class="wrap"><section class="panel"><b>Añade tu lista IPTV</b><div class="row" style="margin-top:10px"><input id="url" placeholder="Pega aquí la URL de tu lista M3U"><button id="load">Cargar URL</button><button class="alt" id="save">💾 Guardar IPTV</button><button class="alt" id="share">🔗 Enlace</button><label><button class="alt">Abrir archivo M3U</button><input id="file" type="file" accept=".m3u,.m3u8,text/plain" hidden></label></div><div id="saved" style="margin-top:10px"></div><div id="status">Guarda tu URL para no volver a escribirla. Puedes generar un enlace para abrirla en otro navegador.</div></section><section id="player" class="panel player"><video id="video" controls playsinline></video><div id="now"></div></section><section class="panel"><div class="row"><input id="search" placeholder="Buscar canal..."><button class="alt" id="favOnly">★ Favoritos</button><button class="alt" id="all">Todos</button></div><div class="tabs" id="tabs" style="margin-top:10px"></div></section><section id="grid" class="grid"><div class="empty">Pega una lista M3U o abre un archivo para empezar.</div></section></main><script>
const $=id=>document.getElementById(id);let channels=[],group='Todos',fav=JSON.parse(localStorage.getItem('tvf-fav')||'[]'),onlyFav=false,saved=JSON.parse(localStorage.getItem('tvf-lists')||'[]');
function parse(text){let lines=text.split(/\r?\n/),out=[];for(let i=0;i<lines.length;i++){if(lines[i].startsWith('#EXTINF')){let meta=lines[i],url=lines[i+1]?.trim();if(!url||url.startsWith('#'))continue;let name=(meta.split(',').slice(1).join(',')||'Canal').trim(),logo=(meta.match(/tvg-logo="([^"]*)"/)||[])[1]||'',g=(meta.match(/group-title="([^"]*)"/)||[])[1]||'Otros';out.push({name,logo,g,url})}}return out}
function render(){let q=$('search').value.toLowerCase();let list=channels.filter(c=>(group==='Todos'||c.g===group)&&(!onlyFav||fav.includes(c.url))&&c.name.toLowerCase().includes(q));$('grid').innerHTML=list.length?list.map((c,i)=>`<article class="channel" data-i="${channels.indexOf(c)}"><span class="star" data-url="${encodeURIComponent(c.url)}">${fav.includes(c.url)?'★':'☆'}</span>${c.logo?`<img src="${c.logo}" onerror="this.style.display='none'">`:''}<div class="name">${esc(c.name)}</div><div class="group">${esc(c.g)}</div></article>`).join(''):'<div class="empty">No hay canales con ese filtro.</div>';document.querySelectorAll('.channel').forEach(e=>e.onclick=()=>play(channels[e.dataset.i]));document.querySelectorAll('.star').forEach(e=>e.onclick=x=>{x.stopPropagation();let u=decodeURIComponent(e.dataset.url);fav=fav.includes(u)?fav.filter(v=>v!==u):[...fav,u];localStorage.setItem('tvf-fav',JSON.stringify(fav));render()})}
function esc(x){return x.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tabs(){let gs=['Todos',...new Set(channels.map(c=>c.g))];$('tabs').innerHTML=gs.map(g=>`<button class="${g===group?'on':''}">${esc(g)}</button>`).join('');document.querySelectorAll('#tabs button').forEach((b,i)=>b.onclick=()=>{group=gs[i];render();tabs()})}
function loaded(text){channels=parse(text);group='Todos';onlyFav=false;tabs();render();$('status').textContent=`${channels.length} canales cargados. Pulsa uno para verlo.`}
function showSaved(){if(!saved.length){$('saved').innerHTML='';return}$('saved').innerHTML='<b>Listas guardadas:</b> '+saved.map((u,i)=>`<button class="alt savedbtn" data-i="${i}">${esc('IPTV '+(i+1))}</button>`).join('');document.querySelectorAll('.savedbtn').forEach(b=>b.onclick=()=>loadUrl(saved[b.dataset.i]))}
async function loadUrl(u){$('url').value=u;if(!u){$('status').textContent='Primero pega una URL IPTV.';return}$('status').textContent='Cargando lista...';let text='';try{let r=await fetch(u,{redirect:'follow'});if(!r.ok)throw Error('direct');text=await r.text()}catch(e){try{let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u));if(!r.ok)throw Error('proxy');text=await r.text()}catch(e2){try{let r=await fetch('https://corsproxy.io/?url='+encodeURIComponent(u));if(!r.ok)throw Error('proxy2');text=await r.text()}catch(e3){$('status').textContent='La URL no permite acceso desde la web. Descarga el archivo M3U y usa «Abrir archivo M3U».';return}}}if(!text.includes('#EXTINF')&&!text.includes('#EXTM3U')){$('status').textContent='La dirección respondió, pero no parece una lista M3U válida. Revisa la URL o descarga el archivo M3U.';return}loaded(text)}
showSaved();
const shared=new URLSearchParams(location.search).get('iptv');if(shared){$('url').value=shared;loadUrl(shared)}else if(saved.length){$('url').value=saved[saved.length-1];loadUrl(saved[saved.length-1])}
function play(c){$('player').classList.add('show');$('now').textContent='▶ '+c.name;let v=$('video');v.src=c.url;v.play().catch(()=>{});$('player').scrollIntoView({behavior:'smooth'})}
$('file').onchange=e=>{let f=e.target.files[0];if(f){let r=new FileReader();r.onload=()=>loaded(r.result);r.readAsText(f)}};$('load').onclick=()=>loadUrl($('url').value.trim());$('save').onclick=()=>{let u=$('url').value.trim();if(!u)return;$('status').textContent='Escribe una URL IPTV para guardarla.';if(!saved.includes(u))saved.push(u);localStorage.setItem('tvf-lists',JSON.stringify(saved));showSaved();$('status').textContent='✅ IPTV guardada en este navegador.'};$('share').onclick=async()=>{let u=$('url').value.trim();if(!u){$('status').textContent='Primero escribe una URL IPTV.';return}let link=location.origin+location.pathname+'?iptv='+encodeURIComponent(u);try{await navigator.clipboard.writeText(link);$('status').textContent='🔗 Enlace copiado. Puedes abrirlo en otro navegador.'}catch(e){prompt('Copia este enlace para abrir tu IPTV en otro navegador:',link)}};$('search').oninput=render;$('favOnly').onclick=()=>{onlyFav=true;render()};$('all').onclick=()=>{onlyFav=false;render()};
</script></body></html>
